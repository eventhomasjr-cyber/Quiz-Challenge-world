
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10172f">
  <title>Quiz Challenge World</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px 14px;
      font-family: Arial, sans-serif;
      color: #fff;
      background: linear-gradient(145deg, #10172f, #22235a);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 480px;
      padding: 24px;
      border: 1px solid #ffffff20;
      border-radius: 24px;
      background: #ffffff0d;
      box-shadow: 0 16px 45px #0003;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      text-align: center;
    }

    .subtitle {
      color: #c6c9e7;
      text-align: center;
      margin: 0 0 22px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    select, button {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      font-size: 16px;
    }

    select {
      margin-bottom: 20px;
      color: #fff;
      background: #25294d;
      border: 1px solid #777da9;
    }

    button {
      cursor: pointer;
      border: none;
      font-weight: bold;
      transition: transform 0.15s, opacity 0.15s;
    }

    button:active { transform: scale(0.98); }
    button:focus-visible, select:focus-visible {
      outline: 3px solid #ffd166;
      outline-offset: 3px;
    }

    .primary {
      color: #151630;
      background: #ffd166;
    }

    .answer {
      margin: 8px 0;
      text-align: start;
      color: white;
      background: #30365e;
      border: 1px solid #ffffff20;
    }

    .answer:disabled {
      cursor: default;
      opacity: 1;
    }

    .answer.correct {
      background: #176b4a;
      border-color: #63e6a5;
    }

    .answer.wrong {
      background: #8b3043;
      border-color: #ff879a;
    }

    .hidden { display: none !important; }

    .topline {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      color: #e0e3ff;
      font-size: 14px;
    }

    .progress-track {
      height: 8px;
      margin-bottom: 22px;
      overflow: hidden;
      border-radius: 20px;
      background: #ffffff20;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: #ffd166;
      transition: width 0.25s;
    }

    #question {
      font-size: 21px;
      line-height: 1.4;
      margin-bottom: 16px;
    }

    #feedback {
      min-height: 24px;
      margin: 14px 0;
      line-height: 1.5;
    }

    .footer {
      margin-top: 18px;
      color: #bfc3e6;
      text-align: center;
      font-size: 12px;
    }

    @media (max-width: 360px) {
      .app { padding: 18px; }
      h1 { font-size: 24px; }
    }
  </style>
</head>

<body>
  <main class="app">
    <h1>🌍 Quiz Challenge World</h1>
    <p class="subtitle" id="subtitle">Learn. Play. Challenge yourself!</p>

    <label for="language" id="languageLabel">Choose your language</label>
    <select id="language">
      <option value="en">English</option>
      <option value="sw">Kiswahili</option>
      <option value="es">Español</option>
      <option value="fr">Français</option>
      <option value="ar">العربية</option>
    </select>

    <section id="home">
      <p id="welcome">Ready to test your knowledge?</p>
      <button class="primary" id="startBtn">Start Quiz</button>
    </section>

    <section id="game" class="hidden">
      <div class="topline">
        <span id="questionCount"></span>
        <span id="scoreLabel"></span>
      </div>

      <div class="progress-track">
        <div class="progress-bar" id="progress"></div>
      </div>

      <h2 id="question"></h2>
      <div id="answers"></div>
      <p id="feedback" aria-live="polite"></p>
      <button class="primary hidden" id="nextBtn">Next Question</button>
    </section>

    <section id="result" class="hidden">
      <h2 id="resultTitle">Quiz complete!</h2>
      <p id="resultScore"></p>
      <p id="resultMessage"></p>
      <button class="primary" id="restartBtn">Play Again</button>
    </section>

    <p class="footer">Quiz Challenge World · Version 1.0</p>
  </main>

      ar: {

        excellent: "عمل ممتاز!",
        good: "أحسنت المحاولة! واصل التدريب.",
        tryAgain: "واصل التدريب. يمكنك النجاح!",
        questions: [
          {

          {

            a: ["خمسة", "ستة", "سبعة"],
            c: 2
          },
          {
            q: "ما أكبر حيوان يعيش على اليابسة؟",
            a: ["الفيل", "الأسد", "الزرافة"],
            c: 0

          {

            c: 1
          }
        ]
      }
    };

    // 2. Keep the quiz state in one place.
    const $ = id => document.getElementById(id);

    let lang = "en";
    let current = 0;
    let score = 0;
    let answered = false;

    function showScreen(screen) {
      ["home", "game", "result"].forEach(id => {
        $(id).classList.toggle("hidden", id !== screen);
      });
    }

    function setLanguage(code) {
      lang = code;
      const t = translations[lang];

      document.documentElement.lang = lang;
      document.documentElement.dir = t.dir;
      document.body.dir = t.dir;

      $("subtitle").textContent = t.subtitle;
      $("languageLabel").textContent = t.language;
      $("welcome").textContent = t.welcome;
      $("startBtn").textContent = t.start;
      $("nextBtn").textContent = t.next;
      $("restartBtn").textContent = t.restart;

      // Changing language returns to the home screen.
      resetQuiz();
      showScreen("home");
    }

    function resetQuiz() {
      current = 0;
      score = 0;
      answered = false;
      $("answers").replaceChildren();
      $("feedback").textContent = "";
      $("nextBtn").classList.add("hidden");
      $("progress").style.width = "0%";
    }

    function startQuiz() {
      resetQuiz();
      showScreen("game");
      renderQuestion();
    }

    function renderQuestion() {
      const t = translations[lang];
      const q = t.questions[current];

      answered = false;
      $("questionCount").textContent =
        `${t.question} ${current + 1} ${t.of} ${t.questions.length}`;
      $("scoreLabel").textContent = `${t.score}: ${score}`;
      $("question").textContent = q.q;
      $("feedback").textContent = "";
      $("nextBtn").classList.add("hidden");

      $("progress").style.width =
        `${(current / t.questions.length) * 100}%`;

      const answers = $("answers");
      answers.replaceChildren();

      q.a.forEach((answer, index) => {
        const button = document.createElement("button");
        button.className = "answer";
        button.textContent = answer;
        button.addEventListener("click", () => chooseAnswer(index));
        answers.appendChild(button);
      });
    }

    function chooseAnswer(index) {
      if (answered) return;
      answered = true;

      const t = translations[lang];
      const q = t.questions[current];
      const buttons = $("answers").querySelectorAll("button");

      buttons.forEach((button, i) => {
        button.disabled = true;

        if (i === q.c) {
          button.classList.add("correct");
        } else if (i === index) {
          button.classList.add("wrong");
        }
      });

      if (index === q.c) {
        score++;
        $("feedback").textContent = t.correct;
      } else {
        $("feedback").textContent = t.wrong;
      }

      $("scoreLabel").textContent = `${t.score}: ${score}`;
      $("progress").style.width =
        `${((current + 1) / t.questions.length) * 100}%`;

      $("nextBtn").classList.remove("hidden");
    }

    function nextQuestion() {
      if (!answered) return;

      current++;

      if (current < translations[lang].questions.length) {
        renderQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      const t = translations[lang];
      const total = t.questions.length;

      showScreen("result");
      $("resultTitle").textContent = t.result;
      $("resultScore").textContent =
        `${t.youScored} ${score} / ${total}`;

      const percentage = (score / total) * 100;
      $("resultMessage").textContent =
        percentage === 100 ? t.excellent :
        percentage >= 60 ? t.good : t.tryAgain;
    }

    $("language").addEventListener("change", event => {
      setLanguage(event.target.value);
    });

    $("startBtn").addEventListener("click", startQuiz);
    $("nextBtn").addEventListener("click", nextQuestion);
    $("restartBtn").addEventListener("click", startQuiz);

    // Start the app in English.
    setLanguage("en");
  </script>
</body>
</html>
